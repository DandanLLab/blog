name: Auto Generate Blog

on:
  push:
    paths:
      - 'generate_blog.py'
      - 'generate_data_json.py'
      - 'generate_sitemap.py'
      
      - 'md/**'
      - 'generate_issues.py'
      - 'requirements.txt'
    branches:
      - master
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # 必须全历史：generate_blog.py 用 git 首次提交时间做文章时间戳真源，
        # 浅克隆会让 git log 拿不到结果，全部退化成构建时间（22 篇同一秒那次就是这么来的）
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate content
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PYTHONIOENCODING: utf-8
      run: |
        python generate_issues.py
        python generate_blog.py
        python generate_data_json.py
        python generate_sitemap.py
        
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generated content update"
          git push origin HEAD:master
        fi